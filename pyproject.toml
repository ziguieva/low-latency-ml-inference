[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "low-latency-ml-inference"
version = "0.1.0"
description = "Low-latency machine learning inference benchmarking between Python and C++."
requires-python = ">=3.11,<3.12"

dependencies = [
    "pandas>=3.0,<4.0",
    "pyarrow>=20.0",
    "scikit-learn>=1.5,<2.0",
    "torch>=2.0,<3.0",
    "joblib>=1.4,<2.0",
    "onnx>=1.17,<2.0",
    "onnxruntime>=1.30,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]